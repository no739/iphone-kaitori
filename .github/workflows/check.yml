name: 買取価格チェック

on:
  schedule:
    # JST 11:00 / 13:00 / 15:00 / 17:00 / 19:00 (UTC+9)
    - cron: "0 2,4,6,8,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係
        run: |
          pip install -r requirements.txt playwright
          playwright install chromium --with-deps

      - name: 価格取得・通知
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          ENOKING_EMAIL: ${{ secrets.ENOKING_EMAIL }}
          ENOKING_PASSWORD: ${{ secrets.ENOKING_PASSWORD }}
          WEBHOOK_REGISTRY_URL: ${{ secrets.WEBHOOK_REGISTRY_URL }}
          WEBHOOK_REGISTRY_KEY: ${{ secrets.WEBHOOK_REGISTRY_KEY }}
        run: python -m scraper.main

      - name: データをコミット
        run: |
          git config user.name "kaitori-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "価格データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            # 他のpushと競合したら、生成データは今回の値を正としてrebase
            git pull --rebase -X theirs origin main || {
              git rebase --abort
              git fetch origin main
              git reset --soft origin/main
              git add docs/data
              git commit -m "価格データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            }
            git push
          fi
