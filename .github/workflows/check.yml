name: 買取価格チェック

on:
  schedule:
    # JST 11:00 / 13:00 / 15:00 / 17:00 / 19:00 (UTC+9)
    - cron: "0 2,4,6,8,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係
        run: pip install -r requirements.txt

      - name: 価格取得・通知
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python -m scraper.main

      - name: データをコミット
        run: |
          git config user.name "kaitori-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "価格データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
